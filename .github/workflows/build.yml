name: Build & Deploy

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  verify:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        run: echo "/usr/local/go/bin" >> $GITHUB_PATH

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Buf lint
        run: |
          if command -v buf >/dev/null 2>&1; then
            buf lint
          else
            echo "buf not installed, skipping buf lint"
          fi

      - name: Golangci-lint
        run: |
          if command -v golangci-lint >/dev/null 2>&1; then
            golangci-lint run ./...
          else
            echo "golangci-lint not installed, skipping"
          fi

  build-and-push:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Registry
        run: |
          echo "${{ secrets.REGISTRY_PASSWORD }}" | docker login register.l3xx.cc -u "${{ secrets.REGISTRY_USERNAME }}" --password-stdin

      - name: Build & Push
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          docker build -t register.l3xx.cc/mint-server:${SHORT_SHA} .
          docker push register.l3xx.cc/mint-server:${SHORT_SHA}

      - name: Update image tag in manifests
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          sed -i "s|image: register.l3xx.cc/mint-server:.*|image: register.l3xx.cc/mint-server:${SHORT_SHA}|" deploy/k8s/mint-server.yaml
          git config user.name "CI Bot"
          git config user.email "ci@l3xx.cc"
          git add deploy/k8s/mint-server.yaml
          git commit -m "ci: update image to ${SHORT_SHA} [skip ci]" || echo "No changes to commit"
          git push
