syntax = "proto3";

package mint_server.agent;

option go_package = "github.com/ethereal3x/mint-server/api/gen/go/mint_server/agent;agentpb";

import "google/api/annotations.proto";
import "google/protobuf/empty.proto";

service AgentService {
    rpc StreamChat(StreamChatRequest) returns (stream StreamChatResponse) {
        option (google.api.http) = {
            post: "/api/v1/chat/stream"
            body: "*"
        };
    }

    rpc GenerateChat(GenerateChatRequest) returns (GenerateChatResponse) {
        option (google.api.http) = {
            post: "/api/v1/chat/chat"
            body: "*"
        };
    }

    rpc ListModels(ListModelsRequest) returns (ListModelsResponse) {
        option (google.api.http) = {
            get: "/api/v1/chat/models"
        };
    }

    rpc GetHistory(GetHistoryRequest) returns (GetHistoryResponse) {
        option (google.api.http) = {
            get: "/api/v1/chat/history/{dialogue_id}"
        };
    }

    rpc ListDialogues(ListDialoguesRequest) returns (ListDialoguesResponse) {
        option (google.api.http) = {
            get: "/api/v1/chat/dialogues"
        };
    }
}

service ModelConfigService {
    rpc ListConfigs(ListConfigsRequest) returns (ListConfigsResponse) {
        option (google.api.http) = {
            get: "/admin/v1/configs"
        };
    }

    rpc GetConfig(GetConfigRequest) returns (ConfigReply) {
        option (google.api.http) = {
            get: "/admin/v1/configs/{id}"
        };
    }

    rpc CreateConfig(CreateConfigRequest) returns (ConfigReply) {
        option (google.api.http) = {
            post: "/admin/v1/configs"
            body: "*"
        };
    }

    rpc UpdateConfig(UpdateConfigRequest) returns (ConfigReply) {
        option (google.api.http) = {
            put: "/admin/v1/configs/{id}"
            body: "*"
        };
    }

    rpc DeleteConfig(DeleteConfigRequest) returns (google.protobuf.Empty) {
        option (google.api.http) = {
            delete: "/admin/v1/configs/{id}"
        };
    }

    rpc GetModelStats(google.protobuf.Empty) returns (ModelStatsResponse) {
        option (google.api.http) = {
            get: "/admin/v1/stats/models"
        };
    }
}

// ---- Chat messages ----

message StreamChatRequest {
    string user_id = 1;
    string question = 2;
    string model = 3;
    string dialogue_id = 4;
    string record_id = 5;
    string file_name = 6;
    bytes file_data = 7;
    repeated string image_urls = 8;
}

message StreamChatResponse {
    int32 code = 1;
    string message = 2;
    string content = 3;
    string dialogue_id = 4;
    string record_id = 5;
    bool done = 6;
    string error = 7;
}

message GenerateChatRequest {
    string user_id = 1;
    string question = 2;
    string model = 3;
    string dialogue_id = 4;
    string record_id = 5;
    string file_name = 6;
    bytes file_data = 7;
    repeated string image_urls = 8;
}

message GenerateChatResponse {
    int32 code = 1;
    string message = 2;
    string content = 3;
    string dialogue_id = 4;
    string record_id = 5;
    string error = 6;
}

message ListModelsRequest {}

message ListModelsResponse {
    int32 code = 1;
    string message = 2;
    repeated ManufacturerGroup manufacturers = 3;
}

message ManufacturerGroup {
    // 厂商名称
    string manufacturer = 1;
    // 该厂商下的模型列表
    repeated ModelInfo models = 2;
}

message ModelInfo {
    // 模型标识
    string model = 1;
    // 模型描述
    string description = 2;
    // 是否支持多模态（图片输入）
    bool supports_multimodal = 3;
}

message GetHistoryRequest {
    string dialogue_id = 1;
}

message GetHistoryResponse {
    int32 code = 1;
    string message = 2;
    repeated HistoryRecord records = 3;
}

message HistoryRecord {
    string record_id = 1;
    string user_content = 2;
    string agent_content = 3;
    string model = 4;
    int64 total_tokens = 5;
    double input_cost = 6;
    double output_cost = 7;
}

message ListDialoguesRequest {
    string user_id = 1;
}

message DialogueSummary {
    string dialogue_id = 1;
    string title = 2;
    int32 message_count = 3;
    string updated_time = 4;
}

message ListDialoguesResponse {
    int32 code = 1;
    string message = 2;
    repeated DialogueSummary dialogues = 3;
}

// ---- Model config messages ----

message ModelConfig {
    int32 id = 1;
    string model_type = 2;
    string manufacturer = 3;
    string description = 4;
    double input_price = 5;
    double output_price = 6;
    string api_key = 7;
    string url = 8;
    int32 max_tokens = 9;
    bool stream = 10;
    float temperature = 11;
    float top_p = 12;
    int32 n = 13;
    float presence_penalty = 14;
    float frequency_penalty = 15;
    string agent_generate_type = 16;
    string route = 17;
    int32 is_enabled = 18;
    // 是否支持多模态（图片输入）
    bool supports_multimodal = 19;
}

message ConfigReply {
    int32 code = 1;
    string message = 2;
    ModelConfig config = 3;
}

message ListConfigsRequest {
    int32 page = 1;
    int32 page_size = 2;
}

message ListConfigsResponse {
    int32 code = 1;
    string message = 2;
    repeated ModelConfig configs = 3;
    int64 total = 4;
}

message GetConfigRequest {
    int32 id = 1;
}

message CreateConfigRequest {
    string model_type = 1;
    string manufacturer = 2;
    string description = 3;
    double input_price = 4;
    double output_price = 5;
    string api_key = 6;
    string url = 7;
    int32 max_tokens = 8;
    bool stream = 9;
    float temperature = 10;
    float top_p = 11;
    int32 n = 12;
    float presence_penalty = 13;
    float frequency_penalty = 14;
    string agent_generate_type = 15;
    string route = 16;
    int32 is_enabled = 17;
    // 是否支持多模态（图片输入）
    bool supports_multimodal = 18;
}

message UpdateConfigRequest {
    int32 id = 1;
    string model_type = 2;
    string manufacturer = 3;
    string description = 4;
    double input_price = 5;
    double output_price = 6;
    string api_key = 7;
    string url = 8;
    int32 max_tokens = 9;
    bool stream = 10;
    float temperature = 11;
    float top_p = 12;
    int32 n = 13;
    float presence_penalty = 14;
    float frequency_penalty = 15;
    string agent_generate_type = 16;
    string route = 17;
    int32 is_enabled = 18;
    // 是否支持多模态（图片输入）
    bool supports_multimodal = 19;
}

message DeleteConfigRequest {
    int32 id = 1;
}

// ---- Stats messages ----

message ModelStatsResponse {
    int32 code = 1;
    string message = 2;
    repeated ModelStat stats = 3;
}

message ModelStat {
    string model = 1;
    int64 total_input_tokens = 2;
    int64 total_output_tokens = 3;
    double total_input_cost = 4;
    double total_output_cost = 5;
}
