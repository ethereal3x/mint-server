---
# mint-server Deployment（init container 从 Consul 拉配置，ArgoCD 控制发布节奏）
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mint-server
  namespace: mint
spec:
  replicas: 2
  selector:
    matchLabels: { app: mint-server }
  template:
    metadata:
      labels: { app: mint-server }
    spec:
      initContainers:
        - name: consul-config
          image: busybox:latest
          command:
            - sh
            - -c
            - |
              CONSUL_URL="http://consul-server.consul.svc.cluster.local:8500/v1/kv/mint-server/config.yaml?raw"
              CONSUL_IP="http://10.43.118.18:8500/v1/kv/mint-server/config.yaml?raw"
              echo "Fetching config from Consul KV..."
              for i in $(seq 1 5); do
                if wget -q -O /etc/mint-server/config.yaml "$CONSUL_URL" 2>/dev/null; then
                  echo "Config fetched via DNS (attempt $i)"
                  break
                fi
                if wget -q -O /etc/mint-server/config.yaml "$CONSUL_IP" 2>/dev/null; then
                  echo "Config fetched via ClusterIP (attempt $i)"
                  break
                fi
                echo "Retry $i/5..."
                sleep 2
              done
              if [ -s /etc/mint-server/config.yaml ]; then
                echo "Config ready"
              else
                echo "ERROR: failed to fetch config"
                exit 1
              fi
          volumeMounts:
            - { name: config, mountPath: /etc/mint-server }
      containers:
        - name: mint-server
          image: register.l3xx.cc/mint-server:b65e3c2
          imagePullPolicy: Always
          ports:
            - { containerPort: 8888, name: grpc }
            - { containerPort: 9999, name: gateway }
          env:
            - name: TZ
              value: Asia/Shanghai
            - name: APC_CONFIG_PATH
              value: /etc/mint-server/config.yaml
          resources:
            requests: { memory: "64Mi", cpu: "50m" }
            limits: { memory: "256Mi", cpu: "500m" }
          readinessProbe:
            tcpSocket: { port: 9999 }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: 9999 }
            initialDelaySeconds: 30
            periodSeconds: 15
          volumeMounts:
            - { name: config, mountPath: /etc/mint-server }
      volumes:
        - name: config
          emptyDir: {}
---
# mint-server Service
apiVersion: v1
kind: Service
metadata:
  name: mint-server
  namespace: mint
spec:
  selector: { app: mint-server }
  ports:
    - { name: gateway, port: 9999 }
    - { name: grpc, port: 8888 }
