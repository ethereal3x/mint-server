---
# MySQL 凭据 Secret（部署前替换 base64 值或使用 external-secrets）
apiVersion: v1
kind: Secret
metadata:
  name: mint-mysql-secret
  namespace: mint
type: Opaque
stringData:
  mysql-root-password: "CHANGE_ME"
---
# 应用业务密钥 Secret（JWT、AES 加密密钥等敏感项，勿写入 Consul KV）
apiVersion: v1
kind: Secret
metadata:
  name: mint-server-secret
  namespace: mint
type: Opaque
stringData:
  jwt-secret: "CHANGE_ME"
  encryption-key: "CHANGE_ME_32_BYTES_LONG_KEY_HERE!!"
  otel-auth-password: "CHANGE_ME"
